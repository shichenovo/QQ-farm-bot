services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20.19.6-alpine3.21}
        PNPM_VERSION: ${PNPM_VERSION:-10.30.2}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      - qq-farm-data:/app/core/data
      - qq-farm-logs:/app/core/data/logs
      # QQ 登录由同一 Compose 项目的 NapCat 容器提供，通过共享 Unix Socket 通信。
      - qq-farm-napcat-bridge:/run/qqfarm-napcat-bridge
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3007
      # NapCat bridge（QQ 扫码/OpenAuth 取 Code）Unix Socket
      - NAPCAT_BRIDGE_SOCKET=/run/qqfarm-napcat-bridge/bridge.sock
      # 授权后不杀 QQ 进程、不删 session-home：实现 QQ 常驻 + 快速登录自动恢复
      - NAPCAT_KEEP_SESSION=1
      # core 重启后自动拉起已保存的账号
      - FARM_AUTOSTART_ACCOUNTS=1
      # 连接监控 + 自动重连（默认开启）
      - FARM_AUTO_RECONNECT=${FARM_AUTO_RECONNECT:-1}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/api/game-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  napcat-farm:
    build:
      context: .
      dockerfile: napcat/Dockerfile
    image: qq-farm-napcat:farm
    container_name: napcat-farm
    restart: unless-stopped
    volumes:
      # 登录态 / 快速登录资料持久化：容器重建不丢，扫码一次长期在线
      - qq-farm-napcat-data:/app/napcat-data
      # 与 core 共享 bridge socket
      - qq-farm-napcat-bridge:/run/qqfarm-napcat-bridge
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NAPCAT_WORKDIR=/app/napcat-data
      - NAPCAT_LAUNCH_MODE=process
      - NAPCAT_LAUNCHER=/app/napcat-shell/start-napcat-xvfb.sh
      - NAPCAT_BRIDGE_SOCKET=/run/qqfarm-napcat-bridge/bridge.sock
      - NAPCAT_BASE_URL=http://127.0.0.1:3001
      - NAPCAT_WEBUI_BASE_URL=http://127.0.0.1:6099
      - NAPCAT_TIMEOUT_MS=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-data:
    name: qq-farm-data
  qq-farm-logs:
    name: qq-farm-logs
  qq-farm-napcat-data:
    name: qq-farm-napcat-data
  qq-farm-napcat-bridge:
    name: qq-farm-napcat-bridge
